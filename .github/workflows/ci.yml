name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-schema:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore dotnet-ef
        run: dotnet tool restore --tool-manifest MiniMercado/dotnet-tools.json

      - name: Build
        run: dotnet build MiniMercado.sln -v minimal

      - name: Test (P-017)
        env:
          ConnectionStrings__MiniMercadoDB: Server=127.0.0.1,1433;Database=MiniMercadoDB;User Id=sa;Password=${{ secrets.MSSQL_SA_PASSWORD }};TrustServerCertificate=True;
        run: dotnet test tests/MiniMercado.Tests/MiniMercado.Tests.csproj --no-build

      - name: Barrera de esquema (P-025)
        env:
          ConnectionStrings__MiniMercadoDB: Server=127.0.0.1,1433;Database=MiniMercadoDB;User Id=sa;Password=${{ secrets.MSSQL_SA_PASSWORD }};TrustServerCertificate=True;
        run: tools/verificar-esquema.sh
